<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>CloudShare - ไฟล์ทั้งหมด</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <!-- Nav Bar -->
  <nav class="bg-slate-800 p-4 border-b border-slate-700 flex justify-between items-center px-8">
    <a href="index.html" class="text-xl font-bold text-indigo-400">CloudShare</a>
    <div class="space-x-4">
      <a href="index.html" class="text-slate-200 hover:text-indigo-400">หน้าแรก</a>
      <a href="upload.html" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg text-sm">อัปโหลดไฟล์</a>
    </div>
  </nav>

  <!-- Container -->
  <div class="max-w-4xl mx-auto p-6 space-y-6">
    <h1 class="text-2xl font-bold">รายการไฟล์ทั้งหมด</h1>
    <div id="fileContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <p class="text-slate-400">กำลังโหลด...</p>
    </div>
  </div>

  <script>
    async function loadFiles() {
      const { data: files } = await db.from('files').select('*').order('created_at', { ascending: false });
      const container = document.getElementById('fileContainer');
      
      if (!files || files.length === 0) {
        container.innerHTML = '<p class="text-slate-400">ยังไม่มีไฟล์ในระบบ</p>';
        return;
      }

      container.innerHTML = files.map(file => `
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex justify-between items-center">
          <div>
            <h3 class="font-semibold text-slate-100">${file.file_name}</h3>
            <p class="text-xs text-slate-400">${(file.file_size / (1024*1024)).toFixed(2)} MB</p>
          </div>
          <a href="file.html?id=${file.id}" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-xs text-indigo-300">
            รายละเอียด / โหลด
          </a>
        </div>
      `).join('');
    }
    loadFiles();
  </script>
</body>
</html>
