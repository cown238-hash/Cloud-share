<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>CloudShare - ดาวน์โหลดไฟล์</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <nav class="bg-slate-800 p-4 border-b border-slate-700 flex justify-between items-center px-8">
    <a href="index.html" class="text-xl font-bold text-indigo-400">CloudShare</a>
    <a href="index.html" class="text-slate-200 hover:text-indigo-400">หน้าแรก</a>
  </nav>

  <div class="max-w-xl mx-auto p-6 mt-10 bg-slate-800 rounded-2xl border border-slate-700 text-center space-y-6" id="fileDetail">
    <p class="text-slate-400">กำลังโหลดรายละเอียดไฟล์...</p>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const fileId = urlParams.get('id');

    async function loadDetail() {
      if (!fileId) return alert('ไม่พบรหัสไฟล์');

      const { data: file } = await db.from('files').select('*').eq('id', fileId).single();
      if (!file) return alert('ไม่พบไฟล์นี้ในระบบ');

      document.getElementById('fileDetail').innerHTML = `
        <h1 class="text-2xl font-bold text-indigo-300 break-all">${file.file_name}</h1>
        <p class="text-sm text-slate-400">ขนาดไฟล์: ${(file.file_size / (1024*1024)).toFixed(2)} MB</p>
        <p class="text-sm text-slate-400">ดาวน์โหลดไปแล้ว: ${file.download_count || 0} ครั้ง</p>
        <button onclick="downloadFile('${file.id}', '${file.file_url}', ${file.download_count || 0})" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-bold">
          ดาวน์โหลดไฟล์
        </button>
      `;
    }

    async function downloadFile(id, url, count) {
      await db.from('files').update({ download_count: count + 1 }).eq('id', id);
      window.open(url, '_blank');
      location.reload();
    }

    loadDetail();
  </script>
</body>
</html>
